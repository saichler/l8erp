syntax = "proto3";

package prj;

option go_package = "./types/prj";

import "l8common.proto";
import "api.proto";

// ============================================================================
// PROJECTS REPORTS
//
// Each module owns its own report type. They deliberately do NOT share
// fin.FinReport: the introspector keys on the bare message name, so a shared
// type means a shared table and one ORM cache per activating service
// (SingleOwnerDatabaseTable). The Section/Line children are per-module for the
// same reason.
// ============================================================================

enum PrjReportType {
  PRJ_REPORT_TYPE_UNSPECIFIED = 0;
  PRJ_REPORT_TYPE_PROJECT_BUDGET = 1;
  PRJ_REPORT_TYPE_RESOURCE_UTILIZATION = 2;
  PRJ_REPORT_TYPE_MILESTONE_TRACKING = 3;
}

message PrjReport {
  string report_id = 1;
  PrjReportType report_type = 2;
  string title = 3;
  string period_name = 4;
  int64 period_start = 5;
  int64 period_end = 6;
  string currency_id = 7;                    // cross-ref: Currency
  string department_id = 8;                  // cross-ref: Department
  string generated_by = 9;                   // cross-ref: Employee
  int64 generated_at = 10;
  repeated PrjReportSection sections = 11;
  l8common.Money grand_total = 12;
  int32 row_count = 13;
  string notes = 14;
  l8common.AuditInfo audit_info = 30;
}

message PrjReportList {
  repeated PrjReport list = 1;
  l8api.L8MetaData metadata = 2;
}

message PrjReportSection {
  string section_id = 1;
  string title = 2;
  repeated PrjReportLine lines = 3;
  l8common.Money section_total = 4;
}

// Line carries debit/credit as well as a single amount: several modules render
// two-sided figures, and dropping them would turn a mechanical migration into a
// rewrite of every generator's arithmetic.
//
// `count` replaces fin.FinReportLine's `level`. No module report ever used that
// field as an indent level -- every one of them stored a headcount, an order
// count or a row count in it, so a column labelled "Level" would have shown a
// tally. Indentation is carried by is_header alone.
message PrjReportLine {
  string line_id = 1;
  string label = 2;
  string reference_id = 3;
  string reference_code = 4;
  string description = 5;
  bool is_header = 6;
  int32 count = 7;
  double percentage = 8;
  l8common.Money debit = 9;
  l8common.Money credit = 10;
  l8common.Money amount = 11;
  l8common.Money budget_amount = 12;
  l8common.Money variance = 13;
  double variance_percent = 14;
  l8common.Money prior_period = 15;
  double quantity = 16;
  int64 entry_date = 17;
}
