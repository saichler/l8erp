# erp-chat: chat instances (l8ai): single writers of their conversations
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: l8erp
  name: erp-chat
  labels:
    app: erp-chat
spec:
  serviceName: erp-chat
  replicas: 3
  selector:
    matchLabels:
      app: erp-chat
  template:
    metadata:
      labels:
        app: erp-chat
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: erp-chat
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: erp-chat
          image: registry.layer-8.dev:44443/erp/erp-chat:latest
          imagePullPolicy: Always
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: l8erp-local-storage
        resources:
          requests:
            storage: 2Gi

