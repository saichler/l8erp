# KIND cluster version — uses KIND's built-in standard StorageClass
# KIND ships with rancher/local-path-provisioner pre-installed as StorageClass "standard"
# No custom StorageClass definition needed.
apiVersion: v1
kind: Namespace
metadata:
  name: l8erp
  labels:
    name: l8erp

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: l8erp
  name: erp-vnet
  labels:
    app: erp-vnet
spec:
  serviceName: erp-vnet
  replicas: 1
  selector:
    matchLabels:
      app: erp-vnet
  template:
    metadata:
      labels:
        app: erp-vnet
    spec:
      hostNetwork: true
      containers:
        - name: erp-vnet
          image: registry.layer-8.dev:44443/erp/erp-vnet:latest
          imagePullPolicy: Always
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - containerPort: 34999
          volumeMounts:
            - name: hdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: l8erp
  name: erp-logs-vnet
  labels:
    app: erp-logs-vnet
spec:
  serviceName: erp-logs-vnet
  replicas: 1
  selector:
    matchLabels:
      app: erp-logs-vnet
  template:
    metadata:
      labels:
        app: erp-logs-vnet
    spec:
      hostNetwork: true
      containers:
        - name: erp-logs-vnet
          image: registry.layer-8.dev:44443/erp/erp-logs-vnet:latest
          imagePullPolicy: Always
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - containerPort: 35004
          volumeMounts:
            - name: hdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: l8erp
  name: erp-log-agent
  labels:
    app: erp-log-agent
spec:
  serviceName: erp-log-agent
  replicas: 1
  selector:
    matchLabels:
      app: erp-log-agent
  template:
    metadata:
      labels:
        app: erp-log-agent
    spec:
      initContainers:
        # Wait for the vnet on this node before starting: services connect to
        # $NODE_IP and panic if the vnet does not answer their first requests.
        # The extra sleep lets a vnet that just opened its port finish starting.
        - name: wait-for-vnet
          image: registry.layer-8.dev:44443/erp/erp-log-agent:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - for p in 48884 48891; do until nc -z -w 2 "$NODE_IP" "$p"; do echo "waiting for vnet $NODE_IP:$p"; sleep 2; done; done; sleep 10
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
      containers:
        - name: erp-log-agent
          image: registry.layer-8.dev:44443/erp/erp-log-agent:latest
          imagePullPolicy: Always
          env:
            - name: LOGPATH
              value: /data/logs/erp
            - name: LOGFILE
              value: "*"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi

---

