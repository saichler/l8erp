  namespace: l8erp
  name: erp-chat
  labels:
    app: erp-chat
spec:
  serviceName: erp-chat
  replicas: 3
  selector:
    matchLabels:
      app: erp-chat
  template:
    metadata:
      labels:
        app: erp-chat
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        # Wait for the vnet on this node before starting: services connect to
        # $NODE_IP and panic if the vnet does not answer their first requests.
        # The extra sleep lets a vnet that just opened its port finish starting.
        - name: wait-for-vnet
          image: registry.layer-8.dev:44443/erp/erp-chat:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - for p in 48884; do until nc -z -w 2 "$NODE_IP" "$p"; do echo "waiting for vnet $NODE_IP:$p"; sleep 2; done; done; sleep 10
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
      containers:
        - name: erp-chat
          image: registry.layer-8.dev:44443/erp/erp-chat:latest
          imagePullPolicy: Always
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi

