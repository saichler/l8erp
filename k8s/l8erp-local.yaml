# Local hostPath version — single-node development and testing
apiVersion: v1
kind: Namespace
metadata:
  name: l8erp
  labels:
    name: l8erp

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: l8erp
  name: erp-vnet
  labels:
    app: erp-vnet
spec:
  selector:
    matchLabels:
      app: erp-vnet
  template:
    metadata:
      labels:
        app: erp-vnet
    spec:
      hostNetwork: true
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: erp-vnet
          image: registry.layer-8.dev:44443/erp/erp-vnet:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - containerPort: 34999
          volumeMounts:
            - name: hdata
              mountPath: /data
      volumes:
        - name: hdata
          hostPath:
            path: /data
            type: DirectoryOrCreate

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: l8erp
  name: erp-logs-vnet
  labels:
    app: erp-logs-vnet
spec:
  selector:
    matchLabels:
      app: erp-logs-vnet
  template:
    metadata:
      labels:
        app: erp-logs-vnet
    spec:
      hostNetwork: true
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: erp-logs-vnet
          image: registry.layer-8.dev:44443/erp/erp-logs-vnet:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - containerPort: 35004
          volumeMounts:
            - name: hdata
              mountPath: /data
      volumes:
        - name: hdata
          hostPath:
            path: /data
            type: DirectoryOrCreate

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: l8erp
  name: erp-log-agent
  labels:
    app: erp-log-agent
spec:
  selector:
    matchLabels:
      app: erp-log-agent
  template:
    metadata:
      labels:
        app: erp-log-agent
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: erp-log-agent
          image: registry.layer-8.dev:44443/erp/erp-log-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LOGPATH
              value: /data/logs/erp
            - name: LOGFILE
              value: "*"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
      volumes:
        - name: hdata
          hostPath:
            path: /data
            type: DirectoryOrCreate

